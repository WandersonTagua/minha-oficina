services:
  - type: web
    name: minha-oficina
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: DATA_FILE
        value: /tmp/store.json
      - key: OWNER_SETUP_KEY
        sync: false
      - key: DEV_SEED_KEY
        sync: false
      - key: DEV_SEED_ENABLED
        value: "true"
      - key: VEHICLE_API_PROVIDER
        value: apibrasil
      - key: VEHICLE_API_URL
        value: https://gateway.apibrasil.io/api/v2/vehicles/dados
