services:
  - type: web
    name: minha-oficina
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: DATA_FILE
        value: /var/data/store.json
    disk:
      name: minha-oficina-data
      mountPath: /var/data
      sizeGB: 1
