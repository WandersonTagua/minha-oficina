<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#050505" />
    <title>Minha Oficina | Painel TV</title>
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/tv.css" />
  </head>
  <body>
    <main class="tv-shell">
      <section class="media-stage" id="mediaStage">
        <button class="fullscreen-button" id="fullscreenButton" type="button">
          ⛶ Tela cheia
        </button>
        <div class="media-empty" id="mediaEmpty">
          <span class="brand-mark brand-mark-large"><span>MO</span></span>
          <strong>Minha Oficina</strong>
          <small>Aguardando mídia do painel</small>
        </div>
      </section>

      <aside class="queue-panel">
        <div class="brand-row">
          <span class="brand-mark"><span>MO</span></span>
          <div>
            <strong>Minha Oficina</strong>
            <small>Painel da oficina</small>
          </div>
        </div>

        <div class="turn-card">
          <span>🔔 Mecânico da vez</span>
          <strong id="currentMechanic">Aguardando fila</strong>
        </div>

        <section class="next-card">
          <h2>Próximos na fila</h2>
          <ol id="queueList"></ol>
          <p id="queueEmpty">Nenhum mecânico aguardando.</p>
        </section>

        <div class="highlight-card" id="highlightCard"></div>
      </aside>
    </main>

    <footer class="ticker">
      <span id="noticeText">Carregando painel...</span>
    </footer>

    <script src="/tv.js"></script>
  </body>
</html>
